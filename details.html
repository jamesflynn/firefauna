<script>
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pass) {
  const raw = b64(document.getElementById('blob').textContent.trim());
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), data = raw.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass),
    'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  document.getElementById('out').innerHTML = new TextDecoder().decode(plain);
  document.getElementById('gate').hidden = true;
}

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const pw = document.getElementById('pw').value;
    await unlock(pw);
    sessionStorage.setItem('fo', pw);   // stay unlocked while the tab is open
  } catch {
    err.textContent = 'Wrong password.';
  }
});

// resume within the same tab
const saved = sessionStorage.getItem('fo');
if (saved) unlock(saved).catch(() => sessionStorage.removeItem('fo'));
</script>
